services:
  postgres:
    image: postgres:17
    container_name: wageup-postgres
    environment:
      POSTGRES_DB: wageup
      POSTGRES_USER: wageup
      POSTGRES_PASSWORD: wageup
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: wageup-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
